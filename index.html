<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aventura de Cartas y Caminata | Karla & Oscar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
            background-color: #0b0f19;
            color: #f8fafc;
        }

        .font-game { font-family: 'Fredoka', cursive; }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #0f172a, #1e293b);
        }

        .glow-box {
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-slate-950 text-slate-100">

    <!-- CANVAS DEL JUEGO -->
    <canvas id="gameCanvas"></canvas>

    <!-- PANTALLA DE INICIO: SELECCIÓN DE DISPOSITIVO Y PERSONAJE -->
    <div id="startScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/95 backdrop-blur-xl transition-all duration-700">
        <div class="relative z-10 max-w-lg w-full bg-slate-900/90 border border-sky-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl glow-box text-center space-y-6 max-h-[95vh] overflow-y-auto">
            
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center text-white text-3xl shadow-lg animate-float">
                <i class="fa-solid fa-envelope-open-text"></i>
            </div>

            <div class="space-y-1">
                <span class="text-[11px] font-bold tracking-[0.2em] text-sky-400 uppercase font-game">Aventura de Cartas y Caminata</span>
                <h1 class="text-3xl sm:text-4xl font-game font-bold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-indigo-300 to-amber-300">
                    Karla & Oscar 💕
                </h1>
                <p class="text-xs text-slate-300">Elige tu dispositivo y tu personaje para comenzar</p>
            </div>

            <!-- 1. SELECCIÓN DE DISPOSITIVO -->
            <div class="bg-slate-950/70 border border-slate-800 rounded-2xl p-4 text-left space-y-3">
                <h3 class="text-xs font-bold text-sky-300 uppercase tracking-wider text-center font-game">1. ¿Dónde estás jugando?</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="selectDevice('pc')" id="btnPC" class="p-3 rounded-xl border border-slate-700 bg-slate-900 text-center transition-all flex flex-col items-center gap-1.5 hover:border-sky-400">
                        <i class="fa-solid fa-laptop text-2xl text-sky-400"></i>
                        <span class="font-bold text-slate-200 text-xs font-game">Computadora (PC)</span>
                    </button>
                    <button onclick="selectDevice('mobile')" id="btnMobile" class="p-3 rounded-xl border border-slate-700 bg-slate-900 text-center transition-all flex flex-col items-center gap-1.5 hover:border-sky-400">
                        <i class="fa-solid fa-mobile-screen text-2xl text-sky-400"></i>
                        <span class="font-bold text-slate-200 text-xs font-game">Celular / Tablet</span>
                    </button>
                </div>
            </div>

            <!-- 2. SELECCIÓN DE PERSONAJE -->
            <div class="bg-slate-950/70 border border-slate-800 rounded-2xl p-4 text-left space-y-3">
                <h3 class="text-xs font-bold text-sky-300 uppercase tracking-wider text-center font-game">2. Elige tu personaje</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="selectRole('karla')" id="btnKarla" class="p-4 rounded-xl border border-sky-500/30 bg-sky-500/10 text-center transition-all flex flex-col items-center gap-1.5">
                        <i class="fa-solid fa-user-astronaut text-2xl text-sky-400"></i>
                        <span class="font-bold text-sky-200 text-sm font-game">Karla</span>
                    </button>
                    <button onclick="selectRole('oscar')" id="btnOscar" class="p-4 rounded-xl border border-indigo-500/30 bg-indigo-500/10 text-center transition-all flex flex-col items-center gap-1.5">
                        <i class="fa-solid fa-robot text-2xl text-indigo-400"></i>
                        <span class="font-bold text-indigo-200 text-sm font-game">Oscar</span>
                    </button>
                </div>
            </div>

            <button id="btnStart" onclick="startGame()" disabled class="w-full py-4 rounded-2xl font-game font-bold text-slate-950 text-sm uppercase tracking-wider bg-gradient-to-r from-sky-400 via-indigo-400 to-amber-300 opacity-40 cursor-not-allowed shadow-lg transition-all">
                Iniciar Aventura ✨
            </button>
        </div>
    </div>

    <!-- BOTONES TÁCTILES PARA CELULAR -->
    <div id="mobileControls" class="hidden absolute inset-0 pointer-events-none z-30 flex justify-between items-end p-6">
        <div class="flex gap-2 pointer-events-auto">
            <button ontouchstart="startMove('left')" ontouchend="stopMove('left')" onmousedown="startMove('left')" onmouseup="stopMove('left')" class="w-14 h-14 rounded-2xl bg-slate-900/80 border border-sky-500/40 text-sky-300 text-xl flex items-center justify-center shadow-lg active:bg-sky-500/30">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <button ontouchstart="startMove('right')" ontouchend="stopMove('right')" onmousedown="startMove('right')" onmouseup="stopMove('right')" class="w-14 h-14 rounded-2xl bg-slate-900/80 border border-sky-500/40 text-sky-300 text-xl flex items-center justify-center shadow-lg active:bg-sky-500/30">
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
        <div class="flex gap-2 pointer-events-auto">
            <button onclick="interactLetter()" class="w-14 h-14 rounded-2xl bg-amber-500 text-slate-950 text-xl flex items-center justify-center shadow-lg active:scale-95" title="Interactuar / Carta">
                <i class="fa-solid fa-envelope"></i>
            </button>
            <button ontouchstart="crouchAction(true)" ontouchend="crouchAction(false)" onmousedown="crouchAction(true)" onmouseup="crouchAction(false)" class="w-14 h-14 rounded-2xl bg-indigo-600 text-white text-xl flex items-center justify-center shadow-lg active:scale-95" title="Agacharse">
                <i class="fa-solid fa-arrow-down"></i>
            </button>
            <button ontouchstart="jumpAction()" onclick="jumpAction()" class="w-14 h-14 rounded-2xl bg-sky-500 text-white text-xl flex items-center justify-center shadow-lg active:scale-95" title="Saltar">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>
    </div>

    <!-- AVISO DE INTERACCIÓN (Presionar E o Botón) -->
    <div id="interactionPrompt" class="absolute bottom-24 left-1/2 -translate-x-1/2 pointer-events-none transition-all duration-300 opacity-0 transform translate-y-4 z-30">
        <div class="bg-slate-900/90 backdrop-blur-md border border-amber-400/50 text-amber-200 px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-3">
            <span class="bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded text-xs font-mono font-bold border border-amber-500/40">E</span>
            <span class="text-xs sm:text-sm font-medium">Presiona <strong class="text-amber-300">E</strong> para abrir la Carta 💌</span>
        </div>
    </div>

    <!-- MODAL DE CARTA / MENSAJE -->
    <div id="letterModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-lg z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="bg-gradient-to-b from-slate-900 via-slate-900 to-slate-950 border border-amber-500/40 rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl relative text-center space-y-4">
            <button onclick="closeLetterModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div class="w-14 h-14 mx-auto rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-2xl border border-amber-500/30">
                <i class="fa-solid fa-envelope-open-text"></i>
            </div>
            <h2 id="modalTitle" class="text-xl font-game font-bold text-amber-200">Carta Especial</h2>
            <p id="modalMessage" class="text-slate-200 text-sm leading-relaxed text-left bg-slate-950/60 p-4 rounded-2xl border border-slate-800 font-medium"></p>
            <button onclick="closeLetterModal()" class="w-full py-3 rounded-xl font-game font-bold text-slate-950 bg-gradient-to-r from-amber-400 via-amber-300 to-amber-500 shadow-lg">
                Continuar Camino ✨
            </button>
        </div>
    </div>

    <!-- UI SUPERIOR -->
    <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none z-20">
        <div class="bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-2xl border border-sky-500/30 shadow-lg pointer-events-auto flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-sky-500 flex items-center justify-center text-white text-xs font-bold">
                <i class="fa-solid fa-map"></i>
            </div>
            <div>
                <h1 class="text-xs sm:text-sm font-game font-bold text-sky-200">Camino de Cartas Motivacionales</h1>
                <p class="text-[10px] text-slate-400" id="hudStatus">Explora hacia adelante y atrás</p>
            </div>
        </div>

        <button onclick="toggleAudio()" class="bg-slate-900/80 hover:bg-slate-800 backdrop-blur-md p-3 rounded-2xl border border-sky-500/30 text-sky-300 shadow-lg pointer-events-auto w-11 h-11 flex items-center justify-center">
            <i id="audioIcon" class="fa-solid fa-volume-xmark text-slate-400"></i>
        </button>
    </div>

    <!-- CHAT EN VIVO -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 w-11/12 max-w-md bg-slate-900/90 backdrop-blur-md border border-sky-500/30 rounded-2xl p-2 shadow-2xl pointer-events-auto z-30 flex items-center gap-2">
        <input type="text" id="chatInput" placeholder="Escribe un mensaje..." maxlength="80" onkeydown="handleChatKey(event)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-sky-500">
        <button onclick="sendChatMessage()" class="bg-gradient-to-r from-sky-500 to-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

    <script>
        const socket = typeof io !== 'undefined' ? io() : { on: () => {}, emit: () => {} };
        let selectedDevice = null;
        let selectedRole = null;
        let gameStarted = false;
        let myId = null;

        function selectDevice(device) {
            selectedDevice = device;
            document.getElementById('btnPC').style.borderColor = device === 'pc' ? '#38bdf8' : '#334155';
            document.getElementById('btnMobile').style.borderColor = device === 'mobile' ? '#38bdf8' : '#334155';
            checkReady();
        }

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('btnKarla').style.borderColor = role === 'karla' ? '#38bdf8' : 'rgba(56,189,248,0.2)';
            document.getElementById('btnOscar').style.borderColor = role === 'oscar' ? '#818cf8' : 'rgba(129,140,248,0.2)';
            checkReady();
        }

        function checkReady() {
            if (selectedDevice && selectedRole) {
                const btn = document.getElementById('btnStart');
                btn.disabled = false;
                btn.classList.remove('opacity-40', 'cursor-not-allowed');
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        let players = {};
        const localPlayer = {
            x: 200,
            y: 0,
            vy: 0,
            gravity: 0.6,
            jumpPower: -12,
            speed: 5.5,
            isGrounded: false,
            isCrouched: false,
            direction: 1,
            width: 36,
            height: 64,
            chatMessage: "",
            chatTimer: 0
        };

        const worldWidth = 3500;
        const groundHeight = 130;
        const camera = { x: 0, smoothness: 0.08 };

        const keys = { left: false, right: false };

        // Definición de las 3 Cartas distribuidas a lo largo del camino
        const letters = [
            { id: 1, x: 800, title: "Carta 1: Primera parada", message: "Se te quiere mucho Karla. Recuerda que vales demasiado y que eres única en este mundo. Nunca lo olvides." },
            { id: 2, x: 1800, title: "Carta 2: Mitad del camino", message: "No te dejes tumbar por nada ni por nadie. Tienes todo mi apoyo para lo que necesites, siempre estoy contigo." },
            { id: 3, x: 2800, title: "Carta 3: La Meta Final", message: "Sé que a veces hay días difíciles, pero tómate las cosas con calma y acuérdate siempre de lo mucho que vales y de lo lejos que vas a llegar." }
        ];

        let activeLetterNear = null;
        let letterModalOpen = false;

        // Controles por Teclado (PC)
        window.addEventListener('keydown', (e) => {
            if (!gameStarted || selectedDevice !== 'pc' || letterModalOpen) return;
            if (document.activeElement.id === 'chatInput') return;

            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w' || e.key === ' ') jumpAction();
            if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') {
                localPlayer.isCrouched = true;
            }
            if (e.key.toLowerCase() === 'e') {
                interactLetter();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (!gameStarted || selectedDevice !== 'pc') return;
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
            if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') {
                localPlayer.isCrouched = false;
            }
        });

        // Controles Táctiles (Celular)
        function startMove(dir) {
            if (dir === 'left') keys.left = true;
            if (dir === 'right') keys.right = true;
        }
        function stopMove(dir) {
            if (dir === 'left') keys.left = false;
            if (dir === 'right') keys.right = false;
        }
        function jumpAction() {
            if (localPlayer.isGrounded && !localPlayer.isCrouched) {
                localPlayer.vy = localPlayer.jumpPower;
                localPlayer.isGrounded = false;
            }
        }
        function crouchAction(isDown) {
            localPlayer.isCrouched = isDown;
        }
        function interactLetter() {
            if (activeLetterNear) {
                openLetterModal(activeLetterNear);
            }
        }

        function startGame() {
            if (!selectedDevice || !selectedRole) return;
            gameStarted = true;
            myId = socket.id;

            document.getElementById('startScreen').classList.add('opacity-0', 'pointer-events-none');

            if (selectedDevice === 'mobile') {
                document.getElementById('mobileControls').classList.remove('hidden');
            }

            socket.emit('joinGame', {
                name: selectedRole === 'karla' ? 'Karla' : 'Oscar',
                role: selectedRole
            });

            initAudio();
            isAudioPlaying = true;
            document.getElementById('audioIcon').className = 'fa-solid fa-volume-high text-sky-400 animate-pulse';
            startMelody();

            gameLoop();
        }

        socket.on('currentPlayers', (serverPlayers) => {
            players = serverPlayers;
            if (!myId) myId = socket.id;
        });

        socket.on('playerMoved', (pData) => {
            if (players[pData.id]) players[pData.id] = pData;
        });

        socket.on('removePlayer', (id) => {
            delete players[id];
        });

        socket.on('playerChat', (data) => {
            if (players[data.id]) {
                players[data.id].chatMessage = data.message;
                players[data.id].chatTimer = 300;
            }
        });

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            localPlayer.chatMessage = msg;
            localPlayer.chatTimer = 300;
            socket.emit('chatMessage', msg);
            input.value = "";
        }
        function handleChatKey(e) { if (e.key === 'Enter') sendChatMessage(); }

        function updateGame() {
            if (!gameStarted || letterModalOpen) return;

            let vx = 0;
            if (!localPlayer.isCrouched) {
                if (keys.left) { vx = -localPlayer.speed; localPlayer.direction = -1; }
                if (keys.right) { vx = localPlayer.speed; localPlayer.direction = 1; }
            }

            localPlayer.x += vx;
            localPlayer.vy += localPlayer.gravity;
            localPlayer.y += localPlayer.vy;

            const floorY = height - groundHeight;
            localPlayer.isGrounded = false;

            if (localPlayer.y >= floorY - (localPlayer.isCrouched ? 40 : localPlayer.height)) {
                localPlayer.y = floorY - (localPlayer.isCrouched ? 40 : localPlayer.height);
                localPlayer.vy = 0;
                localPlayer.isGrounded = true;
            }

            if (localPlayer.x < 50) localPlayer.x = 50;
            if (localPlayer.x > worldWidth - 50) localPlayer.x = worldWidth - 50;

            // Detectar proximidad a las cartas
            activeLetterNear = null;
            letters.forEach(letObj => {
                if (Math.abs(localPlayer.x - letObj.x) < 60) {
                    activeLetterNear = letObj;
                }
            });

            const promptEl = document.getElementById('interactionPrompt');
            if (activeLetterNear && !letterModalOpen) {
                promptEl.classList.remove('opacity-0', 'translate-y-4');
            } else {
                promptEl.classList.add('opacity-0', 'translate-y-4');
            }

            if (localPlayer.chatTimer > 0) localPlayer.chatTimer--;

            if (myId && players[myId]) {
                players[myId].x = localPlayer.x;
                players[myId].y = localPlayer.y;
                players[myId].direction = localPlayer.direction;
                players[myId].isCrouched = localPlayer.isCrouched;
                players[myId].chatMessage = localPlayer.chatMessage;
                players[myId].chatTimer = localPlayer.chatTimer;

                socket.emit('playerMovement', {
                    x: localPlayer.x,
                    y: localPlayer.y,
                    direction: localPlayer.direction,
                    isCrouched: localPlayer.isCrouched
                });
            }

            camera.x += ((localPlayer.x - width / 2) - camera.x) * camera.smoothness;
            if (camera.x < 0) camera.x = 0;
            if (camera.x > worldWidth - width) camera.x = worldWidth - width;
        }

        function openLetterModal(letObj) {
            letterModalOpen = true;
            document.getElementById('modalTitle').innerText = letObj.title;
            document.getElementById('modalMessage').innerText = letObj.message;
            document.getElementById('letterModal').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('interactionPrompt').classList.add('opacity-0', 'translate-y-4');
        }

        function closeLetterModal() {
            letterModalOpen = false;
            document.getElementById('letterModal').classList.add('opacity-0', 'pointer-events-none');
        }

        function renderGame() {
            ctx.clearRect(0, 0, width, height);

            ctx.save();
            ctx.translate(-camera.x, 0);

            const floorY = height - groundHeight;

            // Dibujar las Cartas en el escenario
            letters.forEach(letObj => {
                const lY = floorY - 50;
                ctx.fillStyle = '#f59e0b';
                ctx.beginPath();
                ctx.roundRect(letObj.x - 20, lY, 40, 30, 6);
                ctx.fill();
                ctx.strokeStyle = '#fef3c7';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Ícono de sobre o carta
                ctx.fillStyle = '#fff';
                ctx.font = '16px FontAwesome';
                ctx.textAlign = 'center';
                ctx.fillText('✉️', letObj.x, lY + 20);

                // Texto indicador flotante
                ctx.fillStyle = '#fef3c7';
                ctx.font = 'bold 11px Plus Jakarta Sans, sans-serif';
                ctx.fillText('¡Carta!', letObj.x, lY - 10);
            });

            // Suelo sólido 2D
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, floorY, worldWidth, groundHeight);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(0, floorY, worldWidth, 5);

            // Dibujar jugadores
            Object.values(players).forEach(p => {
                ctx.save();
                const currentHeight = p.isCrouched ? 40 : localPlayer.height;
                ctx.translate(p.x, floorY - currentHeight + (p.y || 0));

                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath(); ctx.ellipse(localPlayer.width / 2, currentHeight + 4, 16, 5, 0, 0, Math.PI * 2); ctx.fill();

                if (p.direction === -1) {
                    ctx.translate(localPlayer.width, 0);
                    ctx.scale(-1, 1);
                }

                // Cuerpo del avatar
                ctx.fillStyle = p.role === 'karla' ? '#0284c7' : '#4f46e5';
                ctx.beginPath();
                ctx.roundRect(0, p.isCrouched ? 10 : 18, localPlayer.width, p.isCrouched ? 30 : 46, 8);
                ctx.fill();

                // Cabeza
                ctx.fillStyle = '#fed7aa';
                ctx.beginPath();
                ctx.arc(localPlayer.width / 2, p.isCrouched ? 2 : 12, 13, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // Nombre y Chat flotante
                ctx.save();
                ctx.translate(p.x, floorY - currentHeight + (p.y || 0));
                ctx.fillStyle = '#f8fafc';
                ctx.font = 'bold 11px Plus Jakarta Sans, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, localPlayer.width / 2, -10);

                if (p.chatMessage && p.chatTimer > 0) {
                    ctx.font = '12px Plus Jakarta Sans, sans-serif';
                    const tw = ctx.measureText(p.chatMessage).width;
                    const bw = tw + 16;
                    const bh = 24;

                    ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.roundRect(localPlayer.width / 2 - bw / 2, -35 - bh, bw, bh, 6);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#38bdf8';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.chatMessage, localPlayer.width / 2, -35 - 8);
                }
                ctx.restore();
            });

            ctx.restore();
        }

        function gameLoop() {
            updateGame();
            renderGame();
            requestAnimationFrame(gameLoop);
        }

        let audioCtx, isAudioPlaying = false, melodyInterval;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        const notes = [261.63, 293.66, 329.63, 392.00];
        function playNote(freq) {
            if (!audioCtx || !isAudioPlaying) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 1.2);
        }
        function startMelody() {
            let idx = 0;
            melodyInterval = setInterval(() => { if (isAudioPlaying) { playNote(notes[idx]); idx = (idx+1)%notes.length; } }, 800);
        }
        function toggleAudio() {
            initAudio(); if (audioCtx.state === 'suspended') audioCtx.resume();
            isAudioPlaying = !isAudioPlaying;
            document.getElementById('audioIcon').className = isAudioPlaying ? 'fa-solid fa-volume-high text-sky-400 animate-pulse' : 'fa-solid fa-volume-xmark text-slate-400';
        }
    </script>
</body>
</html>
