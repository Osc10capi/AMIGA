<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Enlace - AMIGA</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #30363d;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #58a6ff; }
        #status {
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 10px;
        }
        .disconnected { background: #da3633; color: white; }
        .connected { background: #238636; color: white; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Prueba de Conexión en Línea</h1>
        <p>Estado del servidor con Socket.io:</p>
        <div id="status" class="disconnected">Conectando al servidor...</div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        
        // Intentar conectar con el servidor mediante Socket.io
        const socket = io();

        socket.on('connect', () => {
            statusEl.innerText = "¡Conectado exitosamente al servidor! 🎉 (ID: " + socket.id + ")";
            statusEl.className = "connected";
        });

        socket.on('disconnect', () => {
            statusEl.innerText = "Desconectado del servidor ❌";
            statusEl.className = "disconnected";
        });
    </script>

</body>
</html>
