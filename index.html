<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carrera Estelar Motivacional | Karla & Oscar</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            overflow: hidden;
            background-color: #030712;
            color: #f3f4f6;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
        }

        /* Animación única de neón para el inicio */
        @keyframes cyber-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4), inset 0 0 15px rgba(56, 189, 248, 0.2); }
            50% { box-shadow: 0 0 30px rgba(129, 140, 248, 0.8), inset 0 0 25px rgba(129, 140, 248, 0.4); }
        }

        .cyber-card {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(3, 7, 18, 0.95) 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            animation: cyber-glow 4s infinite ease-in-out;
        }

        .glow-button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glow-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden bg-slate-950 text-slate-100">

    <!-- CANVAS DEL JUEGO -->
    <canvas id="gameCanvas"></canvas>

    <!-- PANTALLA DE INICIO ÚNICA Y ESTILIZADA -->
    <div id="startScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-2xl transition-all duration-700">
        <canvas id="portalCanvas" class="absolute inset-0 pointer-events-none opacity-40"></canvas>

        <div class="relative z-10 max-w-lg w-full cyber-card rounded-3xl p-6 sm:p-8 text-center space-y-6 shadow-2xl">
            
            <div class="w-20 h-20 mx-auto rounded-2xl bg-gradient-to-tr from-sky-500 via-indigo-500 to-pink-500 flex items-center justify-center text-white text-3xl shadow-xl animate-bounce">
                <i class="fa-solid fa-meteor"></i>
            </div>

            <div class="space-y-2">
                <span class="text-[10px] font-orbitron font-bold tracking-[0.3em] text-sky-400 uppercase">Sincronización Multijugador</span>
                <h1 class="text-3xl sm:text-4xl font-orbitron font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 via-indigo-300 to-pink-400">
                    CARRERA ESTELAR
                </h1>
                <p class="text-xs text-slate-300">Selecciona quién eres para iniciar el viaje</p>
            </div>

            <!-- SELECCIÓN DE PILOTO -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="selectPilot('karla')" id="btnKarla" class="p-4 rounded-2xl border border-sky-500/30 bg-sky-500/10 hover:bg-sky-500/20 text-center transition-all flex flex-col items-center gap-2 glow-button">
                    <i class="fa-solid fa-user-astronaut text-3xl text-sky-400"></i>
                    <span class="font-orbitron font-bold text-sky-200 text-sm">Karla</span>
                </button>
                <button onclick="selectPilot('oscar')" id="btnOscar" class="p-4 rounded-2xl border border-indigo-500/30 bg-indigo-500/10 hover:bg-indigo-500/20 text-center transition-all flex flex-col items-center gap-2 glow-button">
                    <i class="fa-solid fa-robot text-3xl text-indigo-400"></i>
                    <span class="font-orbitron font-bold text-indigo-200 text-sm">Oscar</span>
                </button>
            </div>

            <!-- CONTROLES -->
            <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-3 text-left text-xs text-slate-400 space-y-1">
                <p class="font-semibold text-sky-300 font-orbitron text-[11px]"><i class="fa-solid fa-gamepad mr-1"></i> Comandos de Vuelo:</p>
                <p>• Saltar obstáculo: <kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-sky-300 font-bold">W</kbd> / <kbd class="bg-slate-800 px-1.5 py-0.5 rounded text-sky-300 font-bold">Espacio</kbd> (o Tocar Pantalla)</p>
            </div>

            <button id="btnLaunch" onclick="launchGame()" disabled class="w-full py-4 rounded-2xl font-orbitron font-bold text-slate-950 text-sm tracking-widest uppercase bg-gradient-to-r from-sky-400 via-indigo-400 to-pink-400 opacity-40 cursor-not-allowed shadow-lg glow-button transition-all flex items-center justify-center gap-2">
                <span>Iniciar Vuelo</span>
                <i class="fa-solid fa-rocket"></i>
            </button>
        </div>
    </div>

    <!-- UI SUPERIOR EN JUEGO -->
    <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none z-20">
        <div class="bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-2xl border border-sky-500/30 shadow-lg pointer-events-auto flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center text-white text-xs font-bold shadow">
                <i class="fa-solid fa-star"></i>
            </div>
            <div>
                <h1 class="text-xs sm:text-sm font-orbitron font-bold text-sky-200" id="hudScore">Distancia: 0m</h1>
                <p class="text-[10px] text-slate-400" id="hudStatus">Conectando...</p>
            </div>
        </div>

        <div class="flex items-center gap-2 pointer-events-auto">
            <button onclick="toggleAudio()" class="bg-slate-900/80 hover:bg-slate-800 backdrop-blur-md p-3 rounded-2xl border border-sky-500/30 text-sky-300 shadow-lg flex items-center justify-center w-11 h-11">
                <i id="audioIcon" class="fa-solid fa-volume-xmark text-slate-400"></i>
            </button>
        </div>
    </div>

    <!-- CHAT EN VIVO -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 w-11/12 max-w-md bg-slate-900/90 backdrop-blur-md border border-sky-500/30 rounded-2xl p-2 shadow-2xl pointer-events-auto z-30 flex items-center gap-2">
        <input type="text" id="chatInput" placeholder="Envía un mensaje estelar..." maxlength="80" onkeydown="handleChatKey(event)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-sky-500">
        <button onclick="sendChatMessage()" class="bg-gradient-to-r from-sky-500 to-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

    <!-- MODAL DE MENSAJE MOTIVACIONAL -->
    <div id="motivationModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-lg z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-500">
        <div class="bg-slate-900 border border-sky-500/40 rounded-3xl max-w-md w-full p-6 text-center space-y-4 shadow-2xl">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-amber-400 to-pink-500 flex items-center justify-center text-slate-950 text-2xl font-bold shadow">
                <i class="fa-solid fa-heart"></i>
            </div>
            <h2 id="modalTitle" class="text-xl font-orbitron font-bold text-sky-300">¡Mensaje Estelar!</h2>
            <p id="modalText" class="text-slate-200 text-sm leading-relaxed font-medium bg-slate-950/60 p-4 rounded-xl border border-slate-800"></p>
            <button onclick="closeModal()" class="w-full py-3 rounded-xl font-orbitron font-bold text-slate-950 bg-gradient-to-r from-sky-400 via-indigo-300 to-pink-300 shadow-lg">
                Continuar Vuelo
            </button>
        </div>
    </div>

    <script>
        const socket = typeof io !== 'undefined' ? io() : { on: () => {}, emit: () => {} };
        let selectedPilot = null;
        let gameStarted = false;
        let myId = null;

        function selectPilot(pilot) {
            selectedPilot = pilot;
            document.getElementById('btnKarla').style.borderColor = pilot === 'karla' ? '#38bdf8' : 'rgba(56,189,248,0.2)';
            document.getElementById('btnOscar').style.borderColor = pilot === 'oscar' ? '#818cf8' : 'rgba(129,140,248,0.2)';
            
            const btn = document.getElementById('btnLaunch');
            btn.disabled = false;
            btn.classList.remove('opacity-40', 'cursor-not-allowed');
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const portalCanvas = document.getElementById('portalCanvas');
        const portalCtx = portalCanvas ? portalCanvas.getContext('2d') : null;

        let width, height;
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (portalCanvas) { portalCanvas.width = width; portalCanvas.height = height; }
        }
        window.addEventListener('resize', resize);
        resize();

        // Fondo animado de la pantalla de inicio
        let portalAngle = 0;
        function drawPortalBackground() {
            if (!portalCtx || gameStarted) return;
            portalCtx.clearRect(0, 0, width, height);
            portalAngle += 0.02;

            portalCtx.save();
            portalCtx.translate(width / 2, height / 2);
            for (let i = 0; i < 5; i++) {
                portalCtx.strokeStyle = i % 2 === 0 ? 'rgba(56, 189, 248, 0.15)' : 'rgba(236, 72, 153, 0.15)';
                portalCtx.lineWidth = 2;
                portalCtx.beginPath();
                portalCtx.arc(0, 0, 80 + i * 50, portalAngle, portalAngle + Math.PI * 1.5);
                portalCtx.stroke();
            }
            portalCtx.restore();
            requestAnimationFrame(drawPortalBackground);
        }
        drawPortalBackground();

        // Variables del juego de carrera estelar
        let players = {};
        const localPlayer = {
            x: 150,
            y: 0,
            vy: 0,
            gravity: 0.55,
            jumpPower: -12,
            isGrounded: false,
            width: 36,
            height: 64,
            distance: 0,
            chatMessage: "",
            chatTimer: 0
        };

        const groundLevel = 120;
        let obstacles = [];
        let obstacleTimer = 0;
        let score = 0;

        const motivationalQuotes = [
            "Se te quiere mucho Karla. Recuerda que vales demasiado y que eres única.",
            "No te dejes tumbar por nada ni por nadie, ¡vales un montón!",
            "Tienes todo mi apoyo para lo que necesites, siempre estoy contigo.",
            "Tómate las cosas con calma y acuérdate siempre de lo mucho que vales."
        ];

        window.addEventListener('keydown', (e) => {
            if (!gameStarted) return;
            if (document.activeElement.id === 'chatInput') return;
            if (e.key === ' ' || e.key.toLowerCase() === 'w' || e.key === 'ArrowUp') {
                jumpAction();
            }
        });

        window.addEventListener('click', () => {
            if (gameStarted && document.activeElement.id !== 'chatInput') {
                jumpAction();
            }
        });

        function jumpAction() {
            if (localPlayer.isGrounded) {
                localPlayer.vy = localPlayer.jumpPower;
                localPlayer.isGrounded = false;
            }
        }

        function launchGame() {
            if (!selectedPilot) return;
            gameStarted = true;
            myId = socket.id;
            document.getElementById('startScreen').classList.add('opacity-0', 'pointer-events-none');

            socket.emit('joinGame', {
                name: selectedPilot === 'karla' ? 'Karla' : 'Oscar',
                role: selectedPilot
            });

            initAudio();
            isAudioPlaying = true;
            document.getElementById('audioIcon').className = 'fa-solid fa-volume-high text-sky-400 animate-pulse';
            startMelody();

            gameLoop();
        }

        socket.on('currentPlayers', (serverPlayers) => {
            players = serverPlayers;
            if (!myId) myId = socket.id;
            updateStatus();
        });

        socket.on('playerMoved', (pData) => {
            if (players[pData.id]) players[pData.id] = pData;
        });

        socket.on('removePlayer', (id) => {
            delete players[id];
            updateStatus();
        });

        socket.on('playerChat', (data) => {
            if (players[data.id]) {
                players[data.id].chatMessage = data.message;
                players[data.id].chatTimer = 300;
            }
        });

        function updateStatus() {
            const count = Object.keys(players).length;
            const statusEl = document.getElementById('hudStatus');
            if (count >= 2) {
                statusEl.innerText = "Modo Dúo Activo ✨";
                statusEl.className = "text-[10px] text-emerald-400 font-bold";
            } else {
                statusEl.innerText = "Modo Solo (Esperando compañero)";
                statusEl.className = "text-[10px] text-amber-400";
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            localPlayer.chatMessage = msg;
            localPlayer.chatTimer = 300;
            socket.emit('chatMessage', msg);
            input.value = "";
        }
        function handleChatKey(e) { if (e.key === 'Enter') sendChatMessage(); }

        // Estrellas de fondo dinámicas
        const stars = Array.from({ length: 40 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2.5 + 1,
            speed: Math.random() * 2 + 1
        }));

        function updateGame() {
            if (!gameStarted) return;

            localPlayer.vy += localPlayer.gravity;
            localPlayer.y += localPlayer.vy;

            const floorY = height - groundLevel;
            localPlayer.isGrounded = false;

            if (localPlayer.y >= floorY - localPlayer.height) {
                localPlayer.y = floorY - localPlayer.height;
                localPlayer.vy = 0;
                localPlayer.isGrounded = true;
            }

            score += 0.1;
            document.getElementById('hudScore').innerText = `Distancia: ${Math.floor(score)}m`;

            // Generar obstáculos estelares
            obstacleTimer++;
            if (obstacleTimer > 110) {
                obstacleTimer = 0;
                obstacles.push({
                    x: width + 50,
                    y: floorY - 45,
                    w: 35,
                    h: 45
                });
            }

            // Mover y verificar colisiones con obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= 6;

                // Colisión segura con rectángulo
                if (
                    localPlayer.x < obstacles[i].x + obstacles[i].w &&
                    localPlayer.x + localPlayer.width > obstacles[i].x &&
                    localPlayer.y < obstacles[i].y + obstacles[i].h &&
                    localPlayer.y + localPlayer.height > obstacles[i].y
                ) {
                    // Si choca, muestra un mensaje motivacional aleatorio y lo salta
                    triggerMotivationModal();
                    obstacles.splice(i, 1);
                    continue;
                }

                if (obstacles[i].x < -50) obstacles.splice(i, 1);
            }

            if (localPlayer.chatTimer > 0) localPlayer.chatTimer--;

            if (myId && players[myId]) {
                players[myId].x = localPlayer.x;
                players[myId].y = localPlayer.y;
                players[myId].chatMessage = localPlayer.chatMessage;
                players[myId].chatTimer = localPlayer.chatTimer;

                socket.emit('playerMovement', {
                    x: localPlayer.x,
                    y: localPlayer.y,
                    chatMessage: localPlayer.chatMessage
                });
            }
        }

        function triggerMotivationModal() {
            const randomQuote = motivationalQuotes[Math.floor(Math.random() * motivationalQuotes.length)];
            document.getElementById('modalText').innerText = randomQuote;
            document.getElementById('motivationModal').classList.remove('opacity-0', 'pointer-events-none');
            document.getElementById('motivationModal').classList.add('opacity-100');
        }

        function closeModal() {
            document.getElementById('motivationModal').classList.remove('opacity-100');
            document.getElementById('motivationModal').classList.add('opacity-0', 'pointer-events-none');
        }

        function renderGame() {
            ctx.clearRect(0, 0, width, height);

            // Fondo estelar en movimiento
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                s.x -= s.speed;
                if (s.x < 0) s.x = width;
                ctx.globalAlpha = Math.random() * 0.5 + 0.3;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1.0;

            const floorY = height - groundLevel;

            // Suelo futurista
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, floorY, width, groundLevel);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(0, floorY, width, 4);

            // Obstáculos
            obstacles.forEach(obs => {
                ctx.fillStyle = '#f43f5e';
                ctx.beginPath();
                ctx.roundRect(obs.x, obs.y, obs.w, obs.h, 8);
                ctx.fill();
                ctx.strokeStyle = '#fda4af';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Dibujar jugadores
            Object.values(players).forEach(p => {
                ctx.save();
                ctx.translate(p.x, floorY - localPlayer.height + (p.y || 0));

                // Sombra
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath(); ctx.ellipse(localPlayer.width / 2, localPlayer.height + 4, 14, 4, 0, 0, Math.PI * 2); ctx.fill();

                // Cuerpo del personaje
                ctx.fillStyle = p.role === 'karlet' || p.role === 'karla' ? '#0284c7' : '#6366f1';
                ctx.beginPath();
                ctx.roundRect(0, 16, localPlayer.width, 48, 8);
                ctx.fill();

                // Cabeza
                ctx.fillStyle = '#fed7aa';
                ctx.beginPath();
                ctx.arc(localPlayer.width / 2, 12, 12, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // Nombre y Chat
                ctx.save();
                ctx.translate(p.x, floorY - localPlayer.height + (p.y || 0));
                ctx.fillStyle = '#e2e8f0';
                ctx.font = 'bold 11px Orbitron, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(p.name, localPlayer.width / 2, -10);

                if (p.chatMessage && p.chatTimer > 0) {
                    ctx.font = '12px Plus Jakarta Sans, sans-serif';
                    const tw = ctx.measureText(p.chatMessage).width;
                    const bw = tw + 16;
                    const bh = 24;

                    ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.roundRect(localPlayer.width / 2 - bw / 2, -35 - bh, bw, bh, 6);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#38bdf8';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.chatMessage, localPlayer.width / 2, -35 - 8);
                }
                ctx.restore();
            });
        }

        function gameLoop() {
            updateGame();
            renderGame();
            requestAnimationFrame(gameLoop);
        }

        let audioCtx, isAudioPlaying = false, melodyInterval;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        const notes = [261.63, 329.63, 392.00, 523.25];
        function playNote(freq) {
            if (!audioCtx || !isAudioPlaying) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.0);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 1.0);
        }
        function startMelody() {
            let idx = 0;
            melodyInterval = setInterval(() => { if (isAudioPlaying) { playNote(notes[idx]); idx = (idx+1)%notes.length; } }, 700);
        }
        function toggleAudio() {
            initAudio(); if (audioCtx.state === 'suspended') audioCtx.resume();
            isAudioPlaying = !isAudioPlaying;
            document.getElementById('audioIcon').className = isAudioPlaying ? 'fa-solid fa-volume-high text-sky-400 animate-pulse' : 'fa-solid fa-volume-xmark text-slate-400';
        }
    </script>
</body>
</html>
